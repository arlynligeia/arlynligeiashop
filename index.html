<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cámara anecoica – poster</title>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { display: block; touch-action: none; cursor: grab; }
  #bar { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center;
         padding: 8px 12px; background: rgba(8, 4, 30, .85); border: 1px solid rgba(25, 217, 255, .4); border-radius: 8px; color: #9fd8ff; font-size: 13px; max-width: 94vw; }
  #bar.off { display: none; }
  #bar select, #bar button, #bar input { font: inherit; }
  #bar button { background: #19d9ff; color: #07031a; border: 0; border-radius: 5px; padding: 6px 12px; font-weight: 700; cursor: pointer; }
  #bar label { display: flex; align-items: center; gap: 6px; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="bar">
  <label>Formato
    <select id="ratio">
      <option value="0.6667" selected>Póster 2:3</option>
      <option value="0.75">3:4</option>
      <option value="1">1:1</option>
      <option value="1.7778">16:9</option>
    </select>
  </label>
  <label>Zoom <input id="fov" type="range" min="40" max="110" value="75"></label>
  <label>Tamaño PNG
    <select id="px">
      <option value="2400">2400 px (lado largo)</option>
      <option value="3600" selected>3600 px</option>
      <option value="5000">5000 px</option>
    </select>
  </label>
  <button id="save">Guardar PNG</button>
  <span>Arrastra: mirar · WASD: mover · Q/E: bajar/subir · H: ocultar barra</span>
</div>

<script type="module">
import * as THREE from 'three';

const W = 8, H = 5, L = 24, hw = W / 2, hl = L / 2, DOOR_Z = -4;
const MAG = 0xff2bd6, CYA = 0x19d9ff;

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07031a);
scene.fog = new THREE.FogExp2(0x07031a, 0.04);
const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 60);
camera.rotation.order = 'YXZ';

// --- Paneles acústicos ---
const S = 0.354;
const pyr = new THREE.ConeGeometry(0.25, 0.35, 4, 1, true);
pyr.rotateY(Math.PI / 4); pyr.translate(0, 0.175, 0);
const foam = new THREE.MeshStandardMaterial({ roughness: 0.55, flatShading: true });
const palette = [0x2b1a8a, 0x4a1fa8, 0x7a24c8, 0x1d3fa0, 0x3a0f70].map(c => new THREE.Color(c));
function panel(origin, u, v, lenU, lenV, normal, skip) {
  const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal);
  const pts = [];
  for (let i = 0; i < Math.floor(lenU / S); i++)
    for (let j = 0; j < Math.floor(lenV / S); j++) {
      const p = origin.clone().addScaledVector(u, (i + .5) * S).addScaledVector(v, (j + .5) * S);
      if (!skip || !skip(p)) pts.push(p);
    }
  const mesh = new THREE.InstancedMesh(pyr, foam, pts.length);
  const m = new THREE.Matrix4(), one = new THREE.Vector3(1, 1, 1);
  pts.forEach((p, i) => { m.compose(p, q, one); mesh.setMatrixAt(i, m); mesh.setColorAt(i, palette[(Math.random() * palette.length) | 0]); });
  scene.add(mesh);
}
const X = new THREE.Vector3(1, 0, 0), Y = new THREE.Vector3(0, 1, 0), Z = new THREE.Vector3(0, 0, 1);
panel(new THREE.Vector3(-hw, 0, -hl), Z, Y, L, H, X);
panel(new THREE.Vector3(hw, 0, -hl), Z, Y, L, H, X.clone().negate(), p => Math.abs(p.z - DOOR_Z) < 1.05 && p.y < 2.9);
panel(new THREE.Vector3(-hw, 0, -hl), X, Y, W, H, Z);
panel(new THREE.Vector3(-hw, 0, hl), X, Y, W, H, Z.clone().negate());
panel(new THREE.Vector3(-hw, H, -hl), X, Z, W, L, Y.clone().negate());

// --- Suelo ---
const c = document.createElement('canvas'); c.width = c.height = 256;
const g = c.getContext('2d');
g.fillStyle = '#0c0a2e'; g.fillRect(0, 0, 256, 256);
g.strokeStyle = '#5b3fd6'; g.lineWidth = 6; g.strokeRect(0, 0, 256, 256);
const tex = new THREE.CanvasTexture(c);
tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(W / .6, L / .6); tex.anisotropy = 8;
const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, L), new THREE.MeshStandardMaterial({ map: tex, metalness: .7, roughness: .35, color: 0xa090ff }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);

// --- LED ---
const neon = hex => new THREE.MeshBasicMaterial({ color: hex });
const box = (w, h, d, x, y, z, hex) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), neon(hex)); m.position.set(x, y, z); scene.add(m); };
for (let i = 0; i < 5; i++) for (const s of [-1, 1]) box(.12, .04, 2.6, s * 2.3, H - .37, -10 + i * 4.8, (i + (s > 0 ? 1 : 0)) % 2 ? CYA : MAG);
for (const s of [-1, 1]) box(.06, .03, L - 1, s * (hw - .45), .02, 0, CYA);
box(W - 1, .03, .06, 0, .02, -hl + .45, CYA);

scene.add(new THREE.AmbientLight(0x3a2a80, .9));
[-10, -4, 2, 8].forEach((z, i) => { const l = new THREE.PointLight(i % 2 ? CYA : MAG, 28, 14, 2); l.position.set(0, H - .8, z); scene.add(l); });
const dl = new THREE.PointLight(MAG, 18, 8, 2); dl.position.set(hw - 1, 1.6, DOOR_Z); scene.add(dl);

// --- Puerta ---
const dx = hw - .12;
const door = new THREE.Mesh(new THREE.BoxGeometry(.08, 2.5, 1.4), new THREE.MeshStandardMaterial({ color: 0x15113f, metalness: .6, roughness: .4 }));
door.position.set(dx + .03, 1.25, DOOR_Z); scene.add(door);
box(.06, 2.56, .06, dx, 1.28, DOOR_Z - .75, MAG);
box(.06, 2.56, .06, dx, 1.28, DOOR_Z + .75, MAG);
box(.06, .06, 1.56, dx, 2.56, DOOR_Z, MAG);
box(.06, .5, .06, dx - .04, 1.2, DOOR_Z + .5, CYA);

// --- Controles ---
const pos = { x: 0, y: 1.7, z: 10, yaw: 0, pitch: 0 };
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'KeyH') bar.classList.toggle('off'); });
addEventListener('keyup', e => { keys[e.code] = false; });
let drag = null;
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointerup', () => drag = null);
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  pos.yaw -= (e.clientX - drag.x) * .004;
  pos.pitch = Math.max(-1.2, Math.min(1.2, pos.pitch - (e.clientY - drag.y) * .004));
  drag = { x: e.clientX, y: e.clientY };
});

// --- Tamaño / formato ---
const bar = document.getElementById('bar');
const ratioEl = document.getElementById('ratio'), fovEl = document.getElementById('fov'), pxEl = document.getElementById('px');
function fit() {
  const r = parseFloat(ratioEl.value);
  let w = innerWidth, h = innerHeight;
  if (w / h > r) w = h * r; else h = w / r;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(Math.floor(w), Math.floor(h));
  camera.aspect = r;
  camera.fov = parseFloat(fovEl.value);
  camera.updateProjectionMatrix();
}
ratioEl.onchange = fovEl.oninput = fit;
addEventListener('resize', fit);

// --- Guardar PNG ---
document.getElementById('save').onclick = () => {
  const r = parseFloat(ratioEl.value), long = parseInt(pxEl.value);
  const w = r >= 1 ? long : Math.round(long * r), h = r >= 1 ? Math.round(long / r) : long;
  renderer.setPixelRatio(1);
  renderer.setSize(w, h, false);
  camera.aspect = r; camera.updateProjectionMatrix();
  camera.position.set(pos.x, pos.y, pos.z); camera.rotation.set(pos.pitch, pos.yaw, 0);
  renderer.render(scene, camera);
  cv.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = `camara-anecoica-${w}x${h}.png`;
    a.click();
    URL.revokeObjectURL(a.href);
    fit();
  }, 'image/png');
};

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, .1); last = now;
  const f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  const s = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  const v = (keys.KeyE ? 1 : 0) - (keys.KeyQ ? 1 : 0);
  const k = 3.2 * dt;
  pos.x += (-Math.sin(pos.yaw) * f + Math.cos(pos.yaw) * s) * k;
  pos.z += (-Math.cos(pos.yaw) * f - Math.sin(pos.yaw) * s) * k;
  pos.y = Math.max(.4, Math.min(H - .6, pos.y + v * k));
  pos.x = Math.max(-hw + .8, Math.min(hw - .8, pos.x));
  pos.z = Math.max(-hl + .8, Math.min(hl - .8, pos.z));
  camera.position.set(pos.x, pos.y, pos.z);
  camera.rotation.set(pos.pitch, pos.yaw, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
fit();
requestAnimationFrame(frame);
</script>
</body>
</html>
